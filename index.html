<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Lounge</title>
  <style>
    :root {
      --bg: #0d1321;
      --panel: #111827;
      --panel-2: #1f2937;
      --accent: #38bdf8;
      --accent-2: #8b5cf6;
      --good: #34d399;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg), #111827 35%, #1e293b);
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      padding: 16px 20px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2vw, 2.6rem);
    }

    .badge {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(17,24,39,0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 1.25rem;
    }

    .memory-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(60px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .memory-card {
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 2rem;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.15s ease, opacity 0.2s ease;
      user-select: none;
    }

    .memory-card:hover { transform: translateY(-2px); }
    .memory-card.flipped, .memory-card.matched {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .memory-card.matched {
      background: linear-gradient(135deg, var(--good), #10b981);
    }

    .tap-box {
      min-height: 180px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25), rgba(139, 92, 246, 0.18));
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,0.18);
      margin-top: 14px;
    }

    #tapButton {
      border: none;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      padding: 18px 26px;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 12px 25px rgba(239,68,68,0.35);
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-weight: bold;
      color: var(--muted);
    }

    .status {
      margin-top: 12px;
      color: var(--text);
      min-height: 24px;
      font-weight: 600;
    }

    .music-player {
      margin-top: 18px;
      background: rgba(255,255,255,0.02);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    audio {
      width: 100%;
      margin-bottom: 14px;
    }

    .playlist {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .song {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .song:hover {
      border-color: rgba(56, 189, 248, 0.8);
      transform: translateY(-1px);
    }

    .fun-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .mini-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 12px;
      padding: 14px 12px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      color: var(--muted);
      margin-top: 24px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Game Lounge</h1>
      <div class="badge">Games + Music</div>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Memory Match</h2>
        <div id="memoryBoard" class="memory-board"></div>
        <div class="score-row">
          <span>Matches: <strong id="matchCount">0</strong></span>
          <span>Moves: <strong id="moveCount">0</strong></span>
        </div>
      </section>

      <section class="card">
        <h2>Tap Challenge</h2>
        <div class="tap-box">
          <button id="tapButton">Tap!</button>
        </div>
        <div class="score-row">
          <span>Score: <strong id="tapScore">0</strong></span>
          <span>Best: <strong id="bestScore">0</strong></span>
        </div>
        <div class="status" id="tapStatus">Ready to play!</div>
      </section>

      <section class="card">
        <h2>Music</h2>
        <div class="music-player">
          <audio id="audio" controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
          </audio>

          <div class="playlist">
            <button class="song" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Song 1</button>
            <button class="song" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Song 2</button>
            <button class="song" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Song 3</button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Quick Fun</h2>
        <div class="fun-box">
          <button class="mini-btn" id="quoteBtn">Random Quote</button>
          <button class="mini-btn" id="colorBtn">Random Color</button>
          <button class="mini-btn" id="emojiBtn">Emoji Burst</button>
        </div>
        <div class="status" id="funStatus">Pick a fun button!</div>
      </section>
    </div>

    <footer>Built for GitHub Pages</footer>
  </div>

  <script>
    const emojiSet = ["🎮", "🎵", "🚀", "⭐", "🔥", "🌈", "🎯", "⚡"];
    const memoryBoard = document.getElementById("memoryBoard");
    const matchCount = document.getElementById("matchCount");
    const moveCount = document.getElementById("moveCount");

    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;

    function createBoard() {
      const deck = [...emojiSet, ...emojiSet].sort(() => Math.random() - 0.5);
      memoryBoard.innerHTML = "";
      cards = [];
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      matchCount.textContent = "0";
      moveCount.textContent = "0";

      deck.forEach((emoji, index) => {
        const button = document.createElement("button");
        button.className = "memory-card";
        button.textContent = "?";
        button.dataset.value = emoji;
        button.dataset.index = index;
        button.addEventListener("click", () => revealCard(button));
        memoryBoard.appendChild(button);
        cards.push(button);
      });
    }

    function revealCard(card) {
      if (card.classList.contains("flipped") || card.classList.contains("matched") || flippedCards.length === 2) return;
      card.classList.add("flipped");
      card.textContent = card.dataset.value;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves += 1;
        moveCount.textContent = moves;
        const [first, second] = flippedCards;

        if (first.dataset.value === second.dataset.value) {
          first.classList.add("matched");
          second.classList.add("matched");
          flippedCards = [];
          matchedPairs += 1;
          matchCount.textContent = matchedPairs;

          if (matchedPairs === emojiSet.length) {
            setTimeout(() => {
              alert("You won! Memory game complete!");
              createBoard();
            }, 350);
          }
        } else {
          setTimeout(() => {
            first.classList.remove("flipped");
            second.classList.remove("flipped");
            first.textContent = "?";
            second.textContent = "?";
            flippedCards = [];
          }, 700);
        }
      }
    }

    const tapButton = document.getElementById("tapButton");
    const tapScore = document.getElementById("tapScore");
    const bestScore = document.getElementById("bestScore");
    const tapStatus = document.getElementById("tapStatus");
    let score = 0;
    let best = 0;

    tapButton.addEventListener("click", () => {
      score += 1;
      tapScore.textContent = score;
      tapStatus.textContent = "Nice! Keep tapping!";
      if (score > best) {
        best = score;
        bestScore.textContent = best;
      }
      const hue = Math.floor(Math.random() * 360);
      tapButton.style.filter = `hue-rotate(${hue}deg)`;
    });

    const audio = document.getElementById("audio");
    document.querySelectorAll(".song").forEach(button => {
      button.addEventListener("click", () => {
        audio.src = button.dataset.src;
        audio.play();
      });
    });

    const quoteBtn = document.getElementById("quoteBtn");
    const colorBtn = document.getElementById("colorBtn");
    const emojiBtn = document.getElementById("emojiBtn");
    const funStatus = document.getElementById("funStatus");

    const quotes = [
      "Small wins add up.",
      "Good vibes beat stress.",
      "Fun is part of the plan.",
      "You've got this!",
      "Play a little. Smile a little."
    ];

    quoteBtn.addEventListener("click", () => {
      funStatus.textContent = quotes[Math.floor(Math.random() * quotes.length)];
    });

    colorBtn.addEventListener("click", () => {
      const hue = Math.floor(Math.random() * 360);
      document.body.style.background = `linear-gradient(135deg, hsl(${hue} 40% 18%), hsl(${(hue + 50) % 360} 40% 18%))`;
      funStatus.textContent = "Fresh color unlocked!";
    });

    emojiBtn.addEventListener("click", () => {
      const emojis = ["✨", "🎉", "😄", "🚀", "🌟", "🎵", "🔥"];
      funStatus.textContent = emojis.map(e => e).join(" ");
    });

    createBoard();
    bestScore.textContent = best;
  </script>
</body>
</html>
